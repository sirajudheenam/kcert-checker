name: CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Unit tests and build
  # ─────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        run: go test -count=1 -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build binary
        run: go build -o /dev/null ./cmd/kcert-checker

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ─────────────────────────────────────────────────────────────
  # Integration tests against real kind clusters
  # ─────────────────────────────────────────────────────────────
  integration:
    name: Integration (${{ matrix.k8s }})
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        # Image tags supported by kind v0.33.0 — see https://github.com/kubernetes-sigs/kind/releases/tag/v0.33.0
        k8s:
          - v1.35.8
          - v1.36.4
          - v1.37.0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Create kind cluster (${{ matrix.k8s }})
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: kcert-ci
          node_image: kindest/node:${{ matrix.k8s }}
          wait: 120s

      - name: Apply integration fixtures
        run: kubectl apply -f tests/integration/fixtures/

      - name: Wait for fixture pod
        run: |
          kubectl wait -n kcert-integration \
            pod/kcert-fixture \
            --for=condition=Ready \
            --timeout=120s

      - name: Run integration tests
        run: |
          go test -v -count=1 -timeout=5m \
            -tags integration \
            ./tests/integration/...
        env:
          KUBECONFIG: ${{ env.HOME }}/.kube/config
          KCERT_INTEGRATION_CLUSTER: kcert-ci

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name kcert-ci
