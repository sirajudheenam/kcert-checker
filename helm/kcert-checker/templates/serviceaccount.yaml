{{- /* ServiceAccount used by the kcert-checker Pod. Skipped if serviceAccount.create is false. */ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kcert-checker.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kcert-checker.labels" . | nindent 4 }}
{{- end }}
