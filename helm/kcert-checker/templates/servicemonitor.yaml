{{- /*
ServiceMonitor for the Prometheus Operator (kube-prometheus-stack).
Only rendered when serviceMonitor.enabled is true.
For the standalone prometheus Helm chart, use prometheus-kcert-values.yaml instead.
*/ -}}
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kcert-checker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kcert-checker.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kcert-checker.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
