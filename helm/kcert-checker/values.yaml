# Default values for kcert-checker.
# Override with --set or -f <file> on helm install/upgrade.

replicaCount: 1

image:
  repository: sirajudheenam/kcert-checker
  pullPolicy: IfNotPresent
  tag: "latest"

ui:
  enabled: true
  image:
    repository: sirajudheenam/kcert-checker-ui
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001

# nameOverride / fullnameOverride change the chart name used in resource names.
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # create: true provisions a dedicated ServiceAccount.
  # Set to false to use an existing one and set name below.
  create: true
  name: ""

rbac:
  # create: true provisions the ClusterRole and ClusterRoleBinding.
  # Set to false if you manage RBAC externally.
  create: true

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# securityContext applies to the kcert-checker container.
# runAsUser: 65532 is required — Kubernetes rejects non-numeric usernames
# (e.g. "nonroot") when runAsNonRoot is true.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

# config is rendered into the ConfigMap mounted at /etc/kcert-checker/config.yaml.
config:
  kubernetes:
    mode: "in-cluster"
  scanner:
    namespaces:
      exclude:
        - kube-system
        - kube-public
        - kube-node-lease
    containers:
      include_init_containers: false
      exclude:
        - istio-proxy
        - linkerd-proxy
    pods:
      exclude:
        - "debug-*"
        - "test-*"
    secrets:
      exclude:
        - "sh.helm.release.*"
    certificates:
      # Glob patterns expanded inside each container via `ls -1 <pattern>`.
      # Use directory wildcards (e.g. /etc/certs/*) to catch all cert files
      # without listing every filename. Exact paths also work.
      paths:
        - /etc/ssl/postfix/*
        - /etc/tls/*
        - /etc/certs/*
        - /var/run/secrets/tls/*
  metrics:
    enabled: true
    listen_address: "0.0.0.0:8080"
    path: "/metrics"
  scan:
    interval_seconds: 3600
    warning_days: 30
    critical_days: 7

# serviceMonitor provisions a ServiceMonitor for the Prometheus Operator.
# Only enable if monitoring.coreos.com/v1 CRD is present (kube-prometheus-stack).
# For the standalone prometheus Helm chart, use prometheus-kcert-values.yaml instead.
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
