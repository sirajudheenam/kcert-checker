# ConfigMap holding the kcert-checker config file.
# Mounted read-only into the Pod at /etc/kcert-checker/config.yaml.
# Edit scanner.certificates.paths to add new cert paths to scan.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kcert-checker-config
  namespace: monitoring
data:
  config.yaml: |
    kubernetes:
      # in-cluster: reads the ServiceAccount token mounted by Kubernetes automatically.
      mode: "in-cluster"

    scanner:
      namespaces:
        exclude:
          - kube-system
          - kube-public
          - kube-node-lease

      containers:
        include_init_containers: false
        exclude:
          - istio-proxy
          - linkerd-proxy

      pods:
        exclude:
          - "debug-*"
          - "test-*"

      secrets:
        exclude:
          - "sh.helm.release.*"

      certificates:
        # Glob patterns expanded inside each container via `ls -1 <pattern>`.
        # Use directory wildcards to catch all cert files automatically.
        paths:
          - /etc/ssl/postfix/*
          - /etc/tls/*
          - /etc/certs/*
          - /var/run/secrets/tls/*

    metrics:
      enabled: true
      listen_address: "0.0.0.0:8080"
      path: "/metrics"

    scan:
      interval_seconds: 3600
      warning_days: 30
      critical_days: 7
