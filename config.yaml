kubernetes:
  mode: "kubeconfig"
  # kubeconfig: "/Users/you/.kube/config"   # defaults to ~/.kube/config if omitted
  # context: "kind-kind"                     # defaults to current-context if omitted

scanner:
  namespaces:
    exclude:
      - kube-system
      - kube-public
      - kube-node-lease
      - "openshift-*"

  certificates:
    # Glob patterns expanded inside each container via `ls -1 <pattern>`.
    # Use directory wildcards (e.g. /etc/certs/*) to catch all cert files
    # without listing every filename. Exact paths still work too.
    paths:
      - "/etc/ssl/postfix/*"
      - "/etc/tls/*"
      - "/etc/certs/*"
      - "/tls/*"
      - "/var/run/secrets/tls/*"

  containers:
    include_init_containers: false
    exclude:
      - istio-proxy
      - linkerd-proxy
      - "init-*"

  pods:
    exclude:
      - "debug-*"
      - "test-*"

  secrets:
    exclude:
      - "sh.helm.release.*"

metrics:
  enabled: true
  listen_address: "0.0.0.0:8080"
  path: "/metrics"

scan:
  interval_seconds: 3600 # 3600 = 1 hour; 86400 = 24 hours
  warning_days: 30
  critical_days: 7
